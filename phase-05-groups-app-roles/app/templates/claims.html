{% extends "base.html" %}{% block body %}
<div class="card">
  <h1>Submit a claim</h1>
  <p class="muted">Goes to your manager in Entra ID: {{ session.user.manager_name or "none recorded" }}</p>
  <form method="post" class="row">
    <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
    <select name="currency"><option>USD</option><option>GBP</option><option>NGN</option><option>GHS</option><option>MXN</option></select>
    <select name="category"><option>Travel</option><option>Meals</option><option>Client entertainment</option><option>Software</option><option>Other</option></select>
    <input name="description" placeholder="Description" maxlength="200" required style="flex:1;min-width:200px">
    <button>Submit</button>
  </form>
</div>
<div class="card"><h2>My claims</h2>{% include "_table.html" %}</div>
{% endblock %}
