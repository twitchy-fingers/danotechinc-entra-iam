name: Deploy Danotech Expenses

on:
  push:
    branches: [main]
    paths: ['phase-05-groups-app-roles/app/**']
  workflow_dispatch:

permissions:
  id-token: write   # lets the job request a GitHub OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC (no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the app
        uses: azure/webapps-deploy@v3
        with:
          app-name: danotech-expenses-doi
          package: phase-05-groups-app-roles/app
